# Modelo para o REPOSITÓRIO-ALVO (ex.: fork do Mathlib): .github/workflows/auditor-tier1.yml
# Substitua Enzo47961/auditor e bcdccc68991adb7697902271e748cbf5db62f99a (commit fixado do auditor). Ver docs/ci.md.
# Orçamento (instrução 11): 300 s de wall-clock do PR no steady-state, incluindo cache get;
# 900 s com cache cold (first run); 90 s por arquivo. Os padrões estão no workflow reutilizável.
name: auditor-tier1

on:
  pull_request:
    paths:
      - "**.lean"

permissions:
  contents: read

jobs:
  audit:
    uses: Enzo47961/auditor/.github/workflows/auditor-tier1.yml@bcdccc68991adb7697902271e748cbf5db62f99a
    with:
      auditor-repository: Enzo47961/auditor
      auditor-ref: bcdccc68991adb7697902271e748cbf5db62f99a
      cache-get: true
