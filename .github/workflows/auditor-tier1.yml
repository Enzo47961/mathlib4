# Modelo para o REPOSITÓRIO-ALVO (ex.: fork do Mathlib): .github/workflows/auditor-tier1.yml
# Substitua Enzo47961/auditor e 7f7238d69adcd3255e3693ddbe76a2cf3302dff4 (commit fixado do auditor). Ver docs/ci.md.
# Orçamento (instrução 11): 300 s de wall-clock do PR no steady-state, incluindo cache get;
# 900 s com cache cold (first run); 90 s por arquivo. Os padrões estão no workflow reutilizável.
name: auditor-tier1

on:
  pull_request:
    paths:
      - "**.lean"

permissions:
  contents: read

jobs:
  audit:
    uses: Enzo47961/auditor/.github/workflows/auditor-tier1.yml@7f7238d69adcd3255e3693ddbe76a2cf3302dff4
    with:
      auditor-repository: Enzo47961/auditor
      auditor-ref: 7f7238d69adcd3255e3693ddbe76a2cf3302dff4
      cache-get: true
      timeout-file-seconds: 5   # passo 8 do checklist: forçar timeout (não fazer merge)
