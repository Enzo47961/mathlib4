# Modelo para o REPOSITÓRIO-ALVO (ex.: fork do Mathlib): .github/workflows/auditor-warm-cache.yml
# Substitua Enzo47961/auditor e 7ba9b6f952924d8f133dcdcb2159a221f3da83ce (o MESMO commit do auditor-tier1). Ver docs/ci.md.
# D-61 (instrução 20): salva no branch base os caches do inspetor e do Mathlib, para que um PR
# novo já comece `warm` (um PR só lê o cache do próprio ref ou do base). Rodar depois de cada
# push no base e sempre que o 7ba9b6f952924d8f133dcdcb2159a221f3da83ce mudar (a chave do inspetor inclui o SHA).
# O branch é o base dos PRs auditados (no fork de medição, `auditor-base`).
name: auditor-warm-cache

on:
  workflow_dispatch:
  push:
    branches:
      - auditor-base

permissions:
  contents: read

jobs:
  warm:
    uses: Enzo47961/auditor/.github/workflows/auditor-warm-cache.yml@7ba9b6f952924d8f133dcdcb2159a221f3da83ce
    with:
      auditor-repository: Enzo47961/auditor
      auditor-ref: 7ba9b6f952924d8f133dcdcb2159a221f3da83ce
      cache-get: true
