# Modelo para o REPOSITÓRIO-ALVO (ex.: fork do Mathlib): .github/workflows/auditor-warm-cache.yml
# Substitua Enzo47961/auditor e 7f7238d69adcd3255e3693ddbe76a2cf3302dff4 (o MESMO commit do auditor-tier1). Ver docs/ci.md.
# D-61 (instrução 20): salva no branch base os caches do inspetor e do Mathlib, para que um PR
# novo já comece `warm` (um PR só lê o cache do próprio ref ou do base). Rodar depois de cada
# push no base e sempre que o 7f7238d69adcd3255e3693ddbe76a2cf3302dff4 mudar (a chave do inspetor inclui o SHA).
# O branch é o base dos PRs auditados (no fork de medição, `auditor-base`).
name: auditor-warm-cache

on:
  workflow_dispatch:
  push:
    branches:
      - auditor-base

permissions:
  contents: read

jobs:
  warm:
    uses: Enzo47961/auditor/.github/workflows/auditor-warm-cache.yml@7f7238d69adcd3255e3693ddbe76a2cf3302dff4
    with:
      auditor-repository: Enzo47961/auditor
      auditor-ref: 7f7238d69adcd3255e3693ddbe76a2cf3302dff4
      cache-get: true
