# Modelo para o REPOSITÓRIO-ALVO (ex.: fork do Mathlib): .github/workflows/auditor-warm-cache.yml
# Substitua Enzo47961/auditor e a0e338765152925e902dc50825a116df5b50d503 (o MESMO commit do auditor-tier1). Ver docs/ci.md.
# D-61 (instrução 20): salva no branch base os caches do inspetor e do Mathlib, para que um PR
# novo já comece `warm` (um PR só lê o cache do próprio ref ou do base). Rodar depois de cada
# push no base e sempre que o a0e338765152925e902dc50825a116df5b50d503 mudar (a chave do inspetor inclui o SHA).
# O branch é o base dos PRs auditados (no fork de medição, `auditor-base`).
name: auditor-warm-cache

on:
  workflow_dispatch:
  push:
    branches:
      - auditor-base

permissions:
  contents: read

jobs:
  warm:
    uses: Enzo47961/auditor/.github/workflows/auditor-warm-cache.yml@a0e338765152925e902dc50825a116df5b50d503
    with:
      auditor-repository: Enzo47961/auditor
      auditor-ref: a0e338765152925e902dc50825a116df5b50d503
      cache-get: true
